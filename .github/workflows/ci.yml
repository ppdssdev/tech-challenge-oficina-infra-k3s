name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Terraform validation and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.6'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install checkov==3.2.471 bc-python-hcl2==0.4.3
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash scripts/preflight.sh
      - name: Formatting and patch hygiene
        run: git diff --check
      - name: TFLint
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/terraform-linters/tflint/releases/download/v0.61.0/tflint_linux_amd64.zip -o /tmp/tflint.zip
          echo 'ca4e4e8cb7cc3436f2b6979e9c4fd4e2623a66fcca1ad1fe12f8669967636ae2  /tmp/tflint.zip' | sha256sum --check --strict
          unzip /tmp/tflint.zip -d /tmp/tflint-bin
          /tmp/tflint-bin/tflint --init
          /tmp/tflint-bin/tflint
